<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ETOS ID Palu</title>
<style>body{margin:0;background:#f4f7f6;font-family:system-ui,-apple-system,sans-serif}.boot{min-height:100vh;display:grid;place-items:center;color:#155e3f}.boot div{text-align:center}.spin{width:34px;height:34px;border:3px solid #dcebe3;border-top-color:#155e3f;border-radius:50%;animation:s .7s linear infinite;margin:0 auto 14px}@keyframes s{to{transform:rotate(360deg)}}</style>
</head>
<body><div class="boot"><div><div class="spin"></div><b>Menyiapkan ETOS ID Palu…</b></div></div>
<script>
(async()=>{try{const names=['ui.00.part','ui.01.part','ui.02.part','ui.03.part'];const rs=await Promise.all(names.map(n=>fetch('/'+n+'?v=20260901-1').then(r=>{if(!r.ok)throw Error(n+' HTTP '+r.status);return r.text()})));const html=rs.join('');document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<div class="boot"><div><b>Dashboard gagal dimuat</b><p>'+String(e.message||e)+'</p></div></div>';console.error(e)}})();
</script></body></html>
